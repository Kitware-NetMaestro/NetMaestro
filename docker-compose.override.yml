services:
  django:
    build:
      context: .
      dockerfile: ./dev/django.Dockerfile
    command: [
      "./manage.py",
      "runserver_plus", "0.0.0.0:8000"
    ]
    # Log printing is enhanced by a TTY
    tty: true
    working_dir: /home/vscode/net-maestro
    env_file: ./dev/.env.docker-compose
    environment:
      # Set NM_USER to a host uid:gid so files created in bind mounts are owned by the host user.
      NM_USER: ${NM_USER:-}
    volumes:
      - .:/home/vscode/net-maestro
      - ${ROSS_PATH:-../ross}:/home/vscode/ross
      - pkg_cache:/home/vscode/pkg-cache
    ports:
      - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: ./dev/django.Dockerfile
    command: [
      "uv", "run",
      "celery",
      "--app", "net_maestro.celery",
      "worker",
      "--loglevel", "INFO",
      "--without-mingle",
      "--without-heartbeat",
      "--without-gossip"
    ]
    # uv progress doesn't display properly with a Docker TTY
    tty: false
    working_dir: /home/vscode/net-maestro
    env_file: ./dev/.env.docker-compose
    environment:
      # Set NM_USER to a host uid:gid so files created in bind mounts are owned by the host user.
      NM_USER: ${NM_USER:-}
    volumes:
      - .:/home/vscode/net-maestro
      - ${ROSS_PATH:-../ross}:/home/vscode/ross
      - pkg_cache:/home/vscode/pkg-cache
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pkg_cache:
