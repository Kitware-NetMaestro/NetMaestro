<div class="card bg-base-100 min-w-max" x-data="scatterPlot">
  <div class="card-body">
    <h2 class="card-title text-white">
      Scatter Plot
    </h2>
    <div x-show="noData" x-cloak class="flex items-center justify-center h-64 text-base-content/50">
      <span>No simulation data available for this run.</span>
    </div>
    <div id="scatterPlot" x-show="!noData"></div>
  </div>
  <div class="flex" x-show="!noData && valueList && valueList.length > 0" x-cloak>
    <div class="flex-1 selects">
      <fieldset>
        <legend class="fieldset-legend">
          Choose x-axis value
        </legend>
        <select
          class="select"
          x-model="selectedXAxis"
          @change="updatePlotData"
        >
          <template x-for="value in valueList" :key="value.key">
            <option :value="value.key" x-text="value.label"></option>
          </template>
        </select>
      </fieldset>
    </div>
    <div class="flex-1 selects">
      <fieldset>
        <legend class="fieldset-legend">
          Choose y-axis value
        </legend>
        <select
          class="select"
          x-model="selectedYAxis"
          @change="updatePlotData()"
        >
          <template x-for="value in valueList" :key="value.key">
            <option :value="value.key" x-text="value.label"></option>
          </template>
        </select>
      </fieldset>
    </div>
  </div>
</div>
