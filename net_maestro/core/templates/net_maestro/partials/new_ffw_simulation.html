<div class="bg-base-300 overflow-y-auto" style="height: calc(100vh - 64px);">
  <div class="p-8 max-w-5xl mx-auto">
    <div class="flex flex-row items-start justify-between gap-4">
      <div>
        <div class="flex flex-row items-center gap-2 text-sm text-base-content/60">
          <a
            href="{% url 'simulation-config' %}"
            hx-get="{% url 'simulation-config' %}"
            hx-target="#main-content"
            hx-swap="innerHTML"
            hx-push-url="true"
            class="link link-hover"
          >
            Simulations
          </a>
          <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
          <span>{{ page_heading }}</span>
        </div>
        <h1 class="text-3xl font-semibold mt-2">{{ page_heading }}</h1>
      </div>
      <div class="flex flex-row gap-2">
        <a
          href="{% url 'simulation-config' %}"
          hx-get="{% url 'simulation-config' %}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          hx-push-url="true"
          class="btn btn-ghost"
        >
          Cancel
        </a>
        <button
          type="submit"
          form="ffw-simulation-form"
          name="action"
          value="save"
          class="btn btn-outline btn-primary"
        >
          Save
        </button>
        <button
          type="submit"
          form="ffw-simulation-form"
          name="action"
          value="save_and_run"
          class="btn btn-primary"
        >
          Save and Run
        </button>
      </div>
    </div>

    <form id="ffw-simulation-form" method="post" action="{{ form_action|default:request.path }}">
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="alert alert-error mt-8">
        <ul>
          {% for error in form.non_field_errors %}
          <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}
      <div class="grid grid-cols-1 gap-6 mt-8">
        <div class="card bg-base-100 shadow-sm">
          <div class="card-body">
            <h2 class="card-title mb-4">Simulation Model</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <label class="form-control w-full">
                <div class="label">
                  <span class="label-text">Model Type</span>
                </div>
                <input type="text" value="Fluid Flow WAN" class="input input-bordered w-full" readonly>
              </label>
              <label class="form-control w-full">
                <div class="label">
                  <span class="label-text">{{ form.run_identifier.label }}</span>
                </div>
                {{ form.run_identifier }}
                {% for error in form.run_identifier.errors %}
                <p class="text-error text-sm mt-1">{{ error }}</p>
                {% endfor %}
              </label>
              <label class="form-control w-full md:col-span-2">
                <div class="label">
                  <span class="label-text">{{ form.description.label }}</span>
                </div>
                {{ form.description }}
              </label>
            </div>
          </div>
        </div>

        <div class="card bg-base-100 shadow-sm">
          <div class="card-body">
            <div class="flex flex-row items-center gap-3 mb-4">
              <i class="ri-share-line text-2xl text-accent" aria-hidden="true"></i>
              <h2 class="card-title">Topology and Traffic</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <label class="form-control w-full">
                <div class="label">
                  <span class="label-text">{{ form.topology_name.label }}</span>
                </div>
                {{ form.topology_name }}
                {% for error in form.topology_name.errors %}
                <p class="text-error text-sm mt-1">{{ error }}</p>
                {% endfor %}
              </label>
              <label class="form-control w-full">
                <div class="label">
                  <span class="label-text">{{ form.traffic.label }}</span>
                </div>
                {{ form.traffic }}
                {% for error in form.traffic.errors %}
                <p class="text-error text-sm mt-1">{{ error }}</p>
                {% endfor %}
              </label>
            </div>
          </div>
        </div>

        <div class="card bg-base-100 shadow-sm">
          <div class="card-body">
            <div class="flex flex-row items-center gap-3 mb-4">
              <i class="ri-cpu-line text-2xl text-primary" aria-hidden="true"></i>
              <h2 class="card-title">Engine Parameters</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <label class="form-control w-full">
                <div class="label">
                  <span class="label-text">{{ form.sync.label }}</span>
                </div>
                {{ form.sync }}
                {% for error in form.sync.errors %}
                <p class="text-error text-sm mt-1">{{ error }}</p>
                {% endfor %}
              </label>
              <label class="form-control w-full">
                <div class="label">
                  <span class="label-text">{{ form.np.label }}</span>
                </div>
                {{ form.np }}
                {% for error in form.np.errors %}
                <p class="text-error text-sm mt-1">{{ error }}</p>
                {% endfor %}
              </label>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
