{% for run in runs %}
  <div class="card m-2 p-3 cursor-pointer transition-colors"
       :class="$store.dataStore.selectedRunId === {{ run.pk }}
         ? 'bg-neutral text-neutral-content'
         : 'bg-base-300 hover:bg-base-200'"
       @click="$store.dataStore.selectRun({{ run.pk }})">
    <div class="card-body flex flex-row p-2 items-baseline justify-between">
      <h3>{{ run.name }}</h3>
      {% if run.result.status == 'completed' %}
        <i class="ri-check-line text-success text-lg"></i>
      {% elif run.result.status == 'running' %}
        <i class="ri-run-line text-info text-lg"></i>
      {% elif run.result.status == 'failed' %}
        <i class="ri-error-warning-line text-error text-lg"></i>
      {% elif run.result.status == 'cancelled' %}
        <i class="ri-forbid-line text-warning text-lg"></i>
      {% else %}
        <i class="ri-timer-line text-accent text-lg"></i>
      {% endif %}
    </div>
  </div>
{% empty %}
  <div class="p-4 text-center opacity-60">No runs found</div>
{% endfor %}
