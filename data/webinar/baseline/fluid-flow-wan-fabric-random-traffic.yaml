schema_version: 1
topology:
  format: groups
  params:
    message_size: 32768
    pe_mem_factor: 1024
  groups:
    FLUID_FLOW_WAN_GRP:
      repetitions: 1
      lps:
        fluid-flow-wan-switch-lp: 5
        fluid-flow-wan-terminal-lp: 10
sections:
  fluid_flow_wan:
    topology_yaml_file: fluid-flow-wan-fabric-5-site.yaml
    interval_seconds: 1
    num_send_intervals: 12
    num_drain_intervals: 100
    rng_seed: 12345
    flow_generation_every_n_intervals: 2
    random_flow_min: 100 Gb
    random_flow_max: 300 Gb
    egress_model: pdes
    debug_prints: 0
    backpressure_delay_ms: 1.0
    pause_enabled: 1
    pause_high_watermark_fraction: 0.8
    pause_low_watermark_fraction: 0.5
    terminal_log_path: logs/terminal-events.csv
    switch_log_path: logs/switch-events.csv
    fluid_segment_log_path: logs/fluid-segment-events.csv
